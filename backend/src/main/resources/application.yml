    # ponytail: dev secret; override with JWT_SECRET in prod
    secret: ${JWT_SECRET:dev-secret-change-me-please-make-it-at-least-32-bytes}
    expiration-ms: 86400000
  admin:
    email: admin@fasttrade.com
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
