server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fasttrade
    username: fasttrade
    password: fasttrade123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
